org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Tat incremental compilation cua Kotlin + build song song de tranh loi
# "FilePageCache ... already registered" / "Could not close incremental caches"
# (bug cua Kotlin 2.4.0 khi bien dich nhieu plugin song song tren Windows)
kotlin.incremental=false
org.gradle.parallel=false
